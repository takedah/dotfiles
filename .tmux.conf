set -g mouse on
set -g escape-time 10
set -g history-limit 100000
set -g default-terminal tmux-256color
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-option -sa terminal-overrides ',tmux-256color:RGB'
set-option -g focus-events on
set -g status-interval 5
setw -g mode-keys vi

# appearance
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] '
set -g status-right '#[fg=#89b4fa] %Y-%m-%d %H:%M '
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W '
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#89b4fa fg=#1e1e2e bold'

set -s set-clipboard off
set -s copy-command 'pbcopy'
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel