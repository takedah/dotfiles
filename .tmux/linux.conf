# Default to OSC 52 so copying inside tmux over SSH still reaches the
# clipboard of the terminal on the other end (headless servers have no X).
set -s set-clipboard on

# On a graphical session, hand off to the local clipboard tool instead.
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy > /dev/null' \
    "set -s set-clipboard off ; set -s copy-command 'wl-copy'"
if-shell '[ -z "$WAYLAND_DISPLAY" ] && [ -n "$DISPLAY" ] && command -v xsel > /dev/null' \
    "set -s set-clipboard off ; set -s copy-command 'xsel -ib'"
